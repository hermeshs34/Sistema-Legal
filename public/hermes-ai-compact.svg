<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for modern tech look -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#004182;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a365d;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7941d;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle for icon -->
  <circle cx="60" cy="60" r="45" fill="url(#primaryGradient)" opacity="0.1"/>
  
  <!-- Main icon - Stylized H with AI neural connections -->
  <g transform="translate(25, 25)">
    <!-- Letter H base structure -->
    <rect x="10" y="15" width="8" height="40" fill="url(#primaryGradient)" rx="2"/>
    <rect x="52" y="15" width="8" height="40" fill="url(#primaryGradient)" rx="2"/>
    <rect x="18" y="32" width="36" height="6" fill="url(#primaryGradient)" rx="2"/>
    
    <!-- AI neural network overlay -->
    <circle cx="15" cy="20" r="3" fill="url(#accentGradient)" opacity="0.8"/>
    <circle cx="35" cy="25" r="2" fill="url(#accentGradient)" opacity="0.6"/>
    <circle cx="55" cy="20" r="3" fill="url(#accentGradient)" opacity="0.8"/>
    <circle cx="25" cy="45" r="2" fill="url(#accentGradient)" opacity="0.6"/>
    <circle cx="45" cy="50" r="2" fill="url(#accentGradient)" opacity="0.6"/>
    
    <!-- Neural connections -->
    <line x1="18" y1="22" x2="33" y2="25" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>
    <line x1="37" y1="25" x2="52" y2="22" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>
    <line x1="27" y1="45" x2="43" y2="50" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Tech circuit elements -->
    <rect x="5" y="60" width="12" height="3" fill="url(#primaryGradient)" opacity="0.3" rx="1"/>
    <rect x="53" y="60" width="12" height="3" fill="url(#primaryGradient)" opacity="0.3" rx="1"/>
  </g>
  
  <!-- Company name -->
  <text x="130" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#primaryGradient)">
    HermesAI
  </text>
  
  <!-- Tagline -->
  <text x="130" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#4a5568">
    Tech
  </text>
  
  <!-- Professional descriptor -->
  <text x="130" y="85" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#718096">
    40+ Years Financial Technology Leadership
  </text>
  
  <!-- AI accent line -->
  <rect x="130" y="90" width="180" height="2" fill="url(#accentGradient)" opacity="0.6" rx="1"/>
  
  <!-- Small tech elements -->
  <circle cx="320" cy="35" r="2" fill="url(#accentGradient)" opacity="0.4"/>
  <circle cx="330" cy="42" r="1.5" fill="url(#primaryGradient)" opacity="0.3"/>
  <circle cx="340" cy="38" r="1" fill="url(#accentGradient)" opacity="0.5"/>
</svg>